<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <rect width="560" height="340" fill="#FDF5F7"/>
  <rect width="560" height="6" fill="#8A1538"/>
  <!-- floor -->
  <rect x="30" y="278" width="500" height="6" rx="3" fill="#E5D5DA"/>
  <!-- shadow under body -->
  <ellipse cx="270" cy="281" rx="180" ry="8" fill="#C8A0AA" opacity="0.3"/>

  <!-- HEAD -->
  <circle cx="430" cy="160" r="28" fill="#8A1538"/>
  <!-- NECK -->
  <line x1="420" y1="186" x2="410" y2="200" stroke="#8A1538" stroke-width="16" stroke-linecap="round"/>
  <!-- TORSO diagonal -->
  <line x1="405" y1="204" x2="195" y2="234" stroke="#8A1538" stroke-width="22" stroke-linecap="round"/>
  <!-- RIGHT ARM (near side) - elbow bent, hand on floor -->
  <line x1="385" y1="210" x2="365" y2="252" stroke="#8A1538" stroke-width="16" stroke-linecap="round"/>
  <line x1="365" y1="252" x2="358" y2="276" stroke="#8A1538" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="354" cy="279" rx="9" ry="6" fill="#8A1538"/>
  <!-- LEFT ARM (far side) -->
  <line x1="230" y1="230" x2="218" y2="262" stroke="#8A1538" stroke-width="14" stroke-linecap="round"/>
  <line x1="218" y1="262" x2="214" y2="277" stroke="#8A1538" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="211" cy="279" rx="8" ry="5" fill="#8A1538"/>
  <!-- UPPER LEGS -->
  <line x1="188" y1="236" x2="118" y2="272" stroke="#8A1538" stroke-width="20" stroke-linecap="round"/>
  <!-- LOWER LEGS -->
  <line x1="118" y1="272" x2="72" y2="277" stroke="#8A1538" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="65" cy="278" rx="10" ry="7" fill="#8A1538"/>

  <!-- label -->
  <circle cx="50" cy="38" r="22" fill="#8A1538"/>
  <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">1</text>
  <text x="85" y="32" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#8A1538">انبطاح مائل</text>
  <text x="85" y="52" font-family="Arial, sans-serif" font-size="13" fill="#9CA3AF">ثني الذراعين</text>
  <!-- category tag -->
  <rect x="30" y="300" width="130" height="26" rx="13" fill="#8A153820"/>
  <text x="95" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8A1538">تمرينات القوة</text>
</svg>