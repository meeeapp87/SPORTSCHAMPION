<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <rect width="560" height="340" fill="#F4F8FE"/>
  <rect width="560" height="6" fill="#3B82F6"/>
  <!-- floor -->
  <rect x="30" y="278" width="500" height="6" rx="3" fill="#B0CAFE"/>
  <!-- distance line -->
  <line x1="90" y1="270" x2="470" y2="270" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- distance label -->
  <text x="275" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B82F6">10 متر</text>
  <!-- arrows for shuttle -->
  <path d="M110 255 L170 255" stroke="#3B82F6" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M450 262 L390 262" stroke="#3B82F6" stroke-width="2" marker-end="url(#a2)"/>
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3B82F6"/></marker>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3B82F6"/></marker>
  </defs>

  <!-- LEFT CONE -->
  <polygon points="90,278 110,278 104,235 96,235" fill="#F97316"/>
  <rect x="86" y="278" width="28" height="6" rx="2" fill="#EA6C00"/>
  <!-- cone lines -->
  <line x1="95" y1="260" x2="105" y2="260" stroke="white" stroke-width="2"/>
  <line x1="93" y1="270" x2="107" y2="270" stroke="white" stroke-width="2"/>

  <!-- RIGHT CONE -->
  <polygon points="450,278 470,278 464,235 456,235" fill="#F97316"/>
  <rect x="446" y="278" width="28" height="6" rx="2" fill="#EA6C00"/>
  <line x1="455" y1="260" x2="465" y2="260" stroke="white" stroke-width="2"/>
  <line x1="453" y1="270" x2="467" y2="270" stroke="white" stroke-width="2"/>

  <!-- RUNNING FIGURE (side view, leaning forward, mid-stride) -->
  <!-- HEAD -->
  <circle cx="290" cy="148" r="26" fill="#3B82F6"/>
  <!-- TORSO (leaning forward) -->
  <line x1="283" y1="172" x2="258" y2="220" stroke="#3B82F6" stroke-width="22" stroke-linecap="round"/>
  <!-- NECK -->
  <line x1="288" y1="172" x2="280" y2="185" stroke="#3B82F6" stroke-width="14" stroke-linecap="round"/>
  <!-- FRONT ARM (swinging back) -->
  <line x1="265" y1="188" x2="240" y2="155" stroke="#3B82F6" stroke-width="14" stroke-linecap="round"/>
  <line x1="240" y1="155" x2="228" y2="132" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
  <!-- BACK ARM (swinging forward) -->
  <line x1="275" y1="195" x2="305" y2="218" stroke="#3B82F6" stroke-width="14" stroke-linecap="round"/>
  <line x1="305" y1="218" x2="320" y2="238" stroke="#3B82F6" stroke-width="12" stroke-linecap="round"/>
  <!-- FRONT LEG (extended forward) -->
  <line x1="256" y1="222" x2="230" y2="258" stroke="#3B82F6" stroke-width="18" stroke-linecap="round"/>
  <line x1="230" y1="258" x2="210" y2="278" stroke="#3B82F6" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="205" cy="279" rx="12" ry="6" fill="#3B82F6"/>
  <!-- BACK LEG (bent behind) -->
  <line x1="262" y1="224" x2="295" y2="255" stroke="#3B82F6" stroke-width="18" stroke-linecap="round"/>
  <line x1="295" y1="255" x2="315" y2="240" stroke="#3B82F6" stroke-width="16" stroke-linecap="round"/>

  <!-- label -->
  <circle cx="50" cy="38" r="22" fill="#3B82F6"/>
  <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">4</text>
  <text x="85" y="32" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2563EB">الجري الارتدادي</text>
  <text x="85" y="52" font-family="Arial, sans-serif" font-size="13" fill="#9CA3AF">10م × 4</text>
  <rect x="30" y="300" width="120" height="26" rx="13" fill="#3B82F620"/>
  <text x="90" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2563EB">قياس الرشاقة</text>
</svg>