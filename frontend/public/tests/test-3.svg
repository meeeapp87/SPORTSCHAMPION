<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <rect width="560" height="340" fill="#F4FDF8"/>
  <rect width="560" height="6" fill="#10B981"/>
  <!-- floor -->
  <rect x="30" y="278" width="500" height="6" rx="3" fill="#B0E0CC"/>
  <ellipse cx="280" cy="281" rx="210" ry="7" fill="#10B981" opacity="0.2"/>

  <!-- MEASUREMENT BOX at feet -->
  <rect x="82" y="228" width="52" height="50" rx="4" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="2"/>
  <line x1="82" y1="248" x2="134" y2="248" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="82" y1="258" x2="134" y2="258" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- ruler marks -->
  <line x1="108" y1="228" x2="108" y2="278" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- LEGS straight on floor -->
  <!-- Left leg -->
  <line x1="134" y1="268" x2="320" y2="262" stroke="#10B981" stroke-width="20" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="134" y1="274" x2="320" y2="268" stroke="#10B981" stroke-width="18" stroke-linecap="round"/>
  <!-- FEET (touching the box) -->
  <ellipse cx="126" cy="271" rx="14" ry="8" fill="#10B981"/>

  <!-- HIPS on floor -->
  <ellipse cx="325" cy="265" rx="20" ry="13" fill="#10B981"/>

  <!-- TORSO leaning forward ~40 degrees -->
  <line x1="320" y1="258" x2="230" y2="200" stroke="#10B981" stroke-width="24" stroke-linecap="round"/>

  <!-- HEAD -->
  <circle cx="218" cy="178" r="27" fill="#10B981"/>

  <!-- ARMS reaching forward toward box -->
  <!-- Left arm -->
  <line x1="228" y1="202" x2="168" y2="248" stroke="#10B981" stroke-width="14" stroke-linecap="round"/>
  <line x1="168" y1="248" x2="140" y2="268" stroke="#10B981" stroke-width="12" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="238" y1="208" x2="175" y2="256" stroke="#10B981" stroke-width="13" stroke-linecap="round"/>
  <line x1="175" y1="256" x2="148" y2="272" stroke="#10B981" stroke-width="11" stroke-linecap="round"/>

  <!-- arrow showing reach direction -->
  <path d="M260 310 L200 310" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
  </defs>
  <text x="320" y="315" font-family="Arial, sans-serif" font-size="11" fill="#10B981">اتجاه الوصول</text>

  <!-- label -->
  <circle cx="50" cy="38" r="22" fill="#10B981"/>
  <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">3</text>
  <text x="85" y="32" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0D9668">جلوس طويل</text>
  <text x="85" y="52" font-family="Arial, sans-serif" font-size="13" fill="#9CA3AF">الذراعين أماماً</text>
  <rect x="30" y="300" width="120" height="26" rx="13" fill="#10B98120"/>
  <text x="90" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0D9668">قياس المرونة</text>
</svg>