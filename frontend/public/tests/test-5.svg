<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <rect width="560" height="340" fill="#F8F4FE"/>
  <rect width="560" height="6" fill="#8B5CF6"/>
  <!-- track lane -->
  <rect x="30" y="272" width="500" height="12" rx="6" fill="#DDD0F8"/>
  <line x1="30" y1="278" x2="530" y2="278" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="12,8"/>
  <!-- distance markers -->
  <line x1="180" y1="270" x2="180" y2="286" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="330" y1="270" x2="330" y2="286" stroke="#8B5CF6" stroke-width="1.5"/>
  <line x1="480" y1="270" x2="480" y2="286" stroke="#8B5CF6" stroke-width="1.5"/>
  <!-- speed lines -->
  <line x1="80" y1="175" x2="50" y2="175" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="78" y1="190" x2="45" y2="190" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="82" y1="205" x2="52" y2="205" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- RUNNING FIGURE — dynamic forward-leaning stride -->
  <!-- HEAD -->
  <circle cx="310" cy="135" r="27" fill="#8B5CF6"/>
  <!-- NECK -->
  <line x1="302" y1="160" x2="292" y2="174" stroke="#8B5CF6" stroke-width="15" stroke-linecap="round"/>
  <!-- TORSO (strong forward lean) -->
  <line x1="288" y1="177" x2="255" y2="228" stroke="#8B5CF6" stroke-width="24" stroke-linecap="round"/>
  <!-- LEFT ARM — swinging forward high -->
  <line x1="272" y1="184" x2="240" y2="150" stroke="#8B5CF6" stroke-width="15" stroke-linecap="round"/>
  <line x1="240" y1="150" x2="222" y2="125" stroke="#8B5CF6" stroke-width="13" stroke-linecap="round"/>
  <!-- RIGHT ARM — driving back -->
  <line x1="280" y1="194" x2="318" y2="215" stroke="#8B5CF6" stroke-width="15" stroke-linecap="round"/>
  <line x1="318" y1="215" x2="340" y2="238" stroke="#8B5CF6" stroke-width="13" stroke-linecap="round"/>
  <!-- LEFT LEG — extended far forward (stride) -->
  <line x1="252" y1="230" x2="215" y2="262" stroke="#8B5CF6" stroke-width="20" stroke-linecap="round"/>
  <line x1="215" y1="262" x2="188" y2="277" stroke="#8B5CF6" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="182" cy="278" rx="13" ry="7" fill="#8B5CF6"/>
  <!-- RIGHT LEG — bent and driving up behind -->
  <line x1="260" y1="232" x2="298" y2="258" stroke="#8B5CF6" stroke-width="20" stroke-linecap="round"/>
  <line x1="298" y1="258" x2="322" y2="238" stroke="#8B5CF6" stroke-width="18" stroke-linecap="round"/>

  <!-- finish line suggestion on right -->
  <line x1="500" y1="245" x2="500" y2="285" stroke="#8B5CF6" stroke-width="3"/>
  <rect x="498" y="245" width="20" height="8" fill="#8B5CF6" opacity="0.8"/>
  <rect x="498" y="253" width="20" height="8" fill="white" opacity="0.9"/>
  <rect x="498" y="261" width="20" height="8" fill="#8B5CF6" opacity="0.8"/>
  <rect x="498" y="269" width="20" height="8" fill="white" opacity="0.9"/>

  <!-- label -->
  <circle cx="50" cy="38" r="22" fill="#8B5CF6"/>
  <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">5</text>
  <text x="85" y="32" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#7C3AED">جري مسافات متوسطة</text>
  <text x="85" y="52" font-family="Arial, sans-serif" font-size="13" fill="#9CA3AF">قياس التحمل</text>
  <rect x="30" y="300" width="120" height="26" rx="13" fill="#8B5CF620"/>
  <text x="90" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7C3AED">قياس التحمل</text>
</svg>