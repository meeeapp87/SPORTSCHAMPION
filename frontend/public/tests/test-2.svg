<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340">
  <rect width="560" height="340" fill="#FDFBF4"/>
  <rect width="560" height="6" fill="#D4AF37"/>
  <!-- floor -->
  <rect x="30" y="278" width="500" height="6" rx="3" fill="#E8DFB0"/>
  <ellipse cx="300" cy="281" rx="200" ry="7" fill="#C8B870" opacity="0.25"/>

  <!-- FEET on floor (knees bent) -->
  <ellipse cx="390" cy="276" rx="18" ry="9" fill="#D4AF37"/>
  <ellipse cx="430" cy="276" rx="18" ry="9" fill="#D4AF37"/>
  <!-- LOWER LEGS (going up-left to knees) -->
  <line x1="390" y1="272" x2="360" y2="228" stroke="#D4AF37" stroke-width="20" stroke-linecap="round"/>
  <line x1="430" y1="272" x2="395" y2="225" stroke="#D4AF37" stroke-width="18" stroke-linecap="round"/>
  <!-- UPPER LEGS / thighs (going from knees to hips) -->
  <line x1="360" y1="228" x2="290" y2="246" stroke="#D4AF37" stroke-width="22" stroke-linecap="round"/>
  <line x1="395" y1="225" x2="300" y2="243" stroke="#D4AF37" stroke-width="20" stroke-linecap="round"/>
  <!-- HIPS / lower back (on floor) -->
  <ellipse cx="285" cy="252" rx="22" ry="15" fill="#D4AF37"/>

  <!-- TORSO raised at ~45 degrees, going up-left -->
  <line x1="278" y1="245" x2="170" y2="178" stroke="#D4AF37" stroke-width="24" stroke-linecap="round"/>
  <!-- SHOULDERS -->
  <ellipse cx="162" cy="173" rx="18" ry="14" fill="#D4AF37"/>

  <!-- HEAD -->
  <circle cx="142" cy="142" r="28" fill="#D4AF37"/>

  <!-- ARMS crossed over chest / near head -->
  <!-- Left arm -->
  <line x1="160" y1="175" x2="195" y2="208" stroke="#D4AF37" stroke-width="15" stroke-linecap="round"/>
  <line x1="195" y1="208" x2="210" y2="222" stroke="#D4AF37" stroke-width="13" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="168" y1="180" x2="210" y2="215" stroke="#D4AF37" stroke-width="14" stroke-linecap="round"/>
  <line x1="210" y1="215" x2="228" y2="230" stroke="#D4AF37" stroke-width="12" stroke-linecap="round"/>

  <!-- label -->
  <circle cx="50" cy="38" r="22" fill="#D4AF37"/>
  <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">2</text>
  <text x="85" y="32" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#B5952F">رقود قرفصاء</text>
  <text x="85" y="52" font-family="Arial, sans-serif" font-size="13" fill="#9CA3AF">ثني الجذع أماماً</text>
  <rect x="30" y="300" width="130" height="26" rx="13" fill="#D4AF3720"/>
  <text x="95" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#B5952F">تمرينات القوة</text>
</svg>